<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snefin</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ============================================================
       THEME: Flat Design (style #1)
       Pure colors, no shadows/textures, clean geometry.
       ============================================================ */
    :root {
      --color-primary: #2563eb;
      --color-primary-dark: #1d4ed8;
      --color-primary-light: #dbeafe;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-secondary: #64748b;
      --color-text-muted: #94a3b8;
      --color-border: #e2e8f0;
      --color-up: #ef4444;
      --color-down: #3b82f6;
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-sm: none;
      --shadow-md: none;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --tab-height: 56px;
      --header-height: 52px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Safe area helpers ---------- */
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ---------- Layout ---------- */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .page-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px) + var(--space-md));
    }

    .page-scroll.no-tab {
      padding-bottom: var(--space-md);
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }

    /* ---------- Header ---------- */
    .app-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 var(--space-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-shrink: 0;
    }

    .app-header .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: -12px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--color-text);
      border-radius: var(--radius-full);
    }

    .app-header .back-btn:active {
      background: var(--color-border);
    }

    .app-header .header-title {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
      text-align: center;
      margin-right: 32px;
    }

    .app-header .header-actions {
      display: flex;
      gap: var(--space-sm);
    }

    /* ---------- Bottom Tab Bar ---------- */
    .tab-bar {
      height: var(--tab-height);
      display: flex;
      align-items: stretch;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      position: relative;
      z-index: 30;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.15s;
      min-height: 44px;
      position: relative;
    }

    .tab-item.router-link-active {
      color: var(--color-primary);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 var(--space-lg);
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
      line-height: 1;
    }

    .btn:active {
      opacity: 0.75;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: var(--color-primary);
      border: 1.5px solid var(--color-primary);
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      background: var(--color-border);
      color: var(--color-text-muted);
      cursor: not-allowed;
      opacity: 1;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: var(--space-sm);
    }

    /* ---------- Form ---------- */
    .form-group {
      margin-bottom: var(--space-md);
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xs);
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: var(--font);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: var(--color-primary);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: var(--space-sm);
    }

    .form-row > * {
      flex: 1;
    }

    /* ---------- Stock List ---------- */
    .stock-list {
      display: flex;
      flex-direction: column;
    }

    .stock-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: 14px var(--space-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.1s;
      min-height: 64px;
      text-decoration: none;
      color: inherit;
    }

    .stock-item:active {
      background: var(--color-bg);
    }

    .stock-item:first-child {
      border-top: 1px solid var(--color-border);
    }

    .stock-avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .stock-info {
      flex: 1;
      min-width: 0;
    }

    .stock-symbol {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    .stock-name {
      font-size: 12px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .stock-price-col {
      text-align: right;
      flex-shrink: 0;
    }

    .stock-price {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stock-change {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .stock-change.up { color: var(--color-up); }
    .stock-change.down { color: var(--color-down); }

    /* ---------- Feature Grid ---------- */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
      padding: var(--space-md);
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: var(--space-sm) 2px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--color-text);
      cursor: pointer;
      transition: background 0.1s;
      min-height: 44px;
    }

    .feature-item:active {
      background: var(--color-bg);
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }

    .feature-icon svg {
      width: 26px;
      height: 26px;
    }

    .feature-label {
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      color: var(--color-text-secondary);
      line-height: 1.2;
    }

    /* ---------- Brand Header ---------- */
    .brand-header {
      padding: var(--space-xl) var(--space-md) var(--space-lg);
      background: var(--color-primary);
      color: #fff;
      text-align: center;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      font-size: 14px;
      opacity: 0.85;
      margin-top: var(--space-xs);
    }

    /* ---------- Section Title ---------- */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-muted);
      padding: var(--space-md) var(--space-md) var(--space-sm);
    }

    /* ---------- Loading ---------- */
    .loading-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: #fff;
      gap: var(--space-lg);
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-lg);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Settings List ---------- */
    .settings-list {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .settings-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      min-height: 52px;
      text-decoration: none;
      color: var(--color-text);
      background: var(--color-surface);
      transition: background 0.1s;
    }

    .settings-item:last-child {
      border-bottom: none;
    }

    .settings-item:active {
      background: var(--color-bg);
    }

    .settings-item-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      flex-shrink: 0;
    }

    .settings-item-icon svg {
      width: 22px;
      height: 22px;
    }

    .settings-item-text {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }

    .settings-item-value {
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .settings-item-arrow {
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    /* ---------- Chart ---------- */
    .chart-container {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .chart-container svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-text);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 14px;
      z-index: 999;
      animation: fadeInUp 0.2s ease;
      max-width: 80%;
      text-align: center;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ---------- Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: var(--space-lg);
    }

    .modal-content {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      max-width: 400px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .modal-body {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .modal-close {
      margin-top: var(--space-md);
    }

    /* ---------- Article ---------- */
    .article-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--color-text);
    }

    .article-content p {
      margin-bottom: var(--space-md);
    }

    .article-content h2 {
      font-size: 17px;
      font-weight: 700;
      margin: var(--space-lg) 0 var(--space-sm);
    }

    .article-meta {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }

    /* ---------- Calendar ---------- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .calendar-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: var(--radius-sm);
      position: relative;
      min-height: 36px;
    }

    .calendar-cell.header {
      font-weight: 700;
      font-size: 11px;
      color: var(--color-text-muted);
      aspect-ratio: auto;
      min-height: 28px;
    }

    .calendar-cell.today {
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .calendar-cell.checked {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 700;
    }

    .calendar-cell.empty {
      color: transparent;
    }

    .calendar-cell .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-up);
      position: absolute;
      bottom: 4px;
    }

    /* ---------- Utility ---------- */
    .text-center { text-align: center; }
    .text-muted { color: var(--color-text-secondary); }
    .text-sm { font-size: 13px; }
    .mt-sm { margin-top: var(--space-sm); }
    .mt-md { margin-top: var(--space-md); }
    .mt-lg { margin-top: var(--space-lg); }
    .mb-sm { margin-bottom: var(--space-sm); }
    .mb-md { margin-bottom: var(--space-md); }
    .mb-lg { margin-bottom: var(--space-lg); }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-col { flex-direction: column; }
    .gap-sm { gap: var(--space-sm); }
    .gap-md { gap: var(--space-md); }
    .w-full { width: 100%; }

    /* ---------- Transition ---------- */
    .fade-slide-enter-active,
    .fade-slide-leave-active {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .fade-slide-enter-from {
      opacity: 0;
      transform: translateX(12px);
    }

    .fade-slide-leave-to {
      opacity: 0;
      transform: translateX(-12px);
    }

    /* ---------- Page transition for router-view ---------- */
    .page-enter-active,
    .page-leave-active {
      transition: opacity 0.18s ease;
    }

    .page-enter-from,
    .page-leave-to {
      opacity: 0;
    }

    /* ---------- Range Input ---------- */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 44px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: var(--color-border);
      border-radius: var(--radius-full);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary);
      margin-top: -9px;
      border: 2px solid #fff;
    }

    /* ---------- Empty state ---------- */
    .empty-state {
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      color: var(--color-text-muted);
      font-size: 14px;
    }

    /* ---------- Memo item ---------- */
    .memo-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .memo-item:last-child {
      border-bottom: none;
    }

    .memo-days {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .memo-days.urgent { background: #fee2e2; color: var(--color-danger); }
    .memo-days.soon { background: #fef3c7; color: var(--color-warning); }
    .memo-days.normal { background: var(--color-primary-light); color: var(--color-primary); }

    .memo-info {
      flex: 1;
      min-width: 0;
    }

    .memo-name {
      font-size: 15px;
      font-weight: 600;
    }

    .memo-detail {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* ============================================================
       HOW TO ADD A NEW PAGE
       ------------------------------------------------------------
       1. Add a route object to the `routes` array below with
          { path: '/your-path', component: YourComponent }.
       2. Define `const YourComponent = { ... }` with a template.
       3. If it should appear in the bottom tab bar, add a
          <router-link> inside the <nav class="tab-bar"> in the
          App component template.
       ============================================================ */

    const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

    /* ============================================================
       BUILT-IN STOCK DATA (20 US stocks)
       ============================================================ */
    const STOCK_DATA = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 189.45, change: 1.23 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.60, change: 0.85 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 168.30, change: -0.42 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 201.75, change: 2.10 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 124.80, change: 3.45 },
      { symbol: 'META', name: 'Meta Platforms', price: 502.30, change: 1.10 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 248.90, change: -2.35 },
      { symbol: 'BRKB', name: 'Berkshire Hathaway', price: 452.15, change: 0.28 },
      { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.40, change: -0.65 },
      { symbol: 'V', name: 'Visa Inc.', price: 279.55, change: 0.52 },
      { symbol: 'UNH', name: 'UnitedHealth Group', price: 512.70, change: -1.20 },
      { symbol: 'XOM', name: 'Exxon Mobil', price: 113.25, change: 0.95 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.40, change: 0.35 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.80, change: -0.18 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 167.90, change: 0.72 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 458.25, change: 0.91 },
      { symbol: 'HD', name: 'Home Depot', price: 342.60, change: -0.55 },
      { symbol: 'CVX', name: 'Chevron Corp.', price: 158.30, change: 1.42 },
      { symbol: 'ABBV', name: 'AbbVie Inc.', price: 178.95, change: -0.30 },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 62.85, change: 0.48 }
    ];

    // Generate 30-day price history for a stock
    function generateHistory(symbol, basePrice) {
      const history = [];
      let price = basePrice * 0.92;
      const seed = symbol.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      for (let i = 0; i < 30; i++) {
        const pseudoRandom = Math.sin(seed + i * 12.9898) * 43758.5453;

                  </div>
                  <div class="flex-between" style="padding:4px 0;">
                    <span class="text-muted text-sm">MD5 Digest</span>
                    <span style="font-weight:600;font-size:12px;word-break:break-all;text-align:right;max-width:60%;">{{ pwdHash }}</span>
                  </div>
                  <div style="height:6px;background:var(--color-border);border-radius:var(--radius-full);margin-top:var(--space-sm);overflow:hidden;">
                    <div :style="{ width: pwdScore + '%', height: '100%', background: pwdColor, borderRadius: 'var(--radius-full)', transition: 'width 0.3s' }"></div>
                  </div>
                </div>
                <div class="text-muted text-sm mt-sm">Offline financial security rules applied locally.</div>
              </div>

              <!-- Credit Memo -->
              <div v-if="activeTool === 'memo'" class="card">
                <div class="card-title">Credit Memo</div>
                <div class="form-group">
                  <label class="form-label">Counterparty</label>
                  <input class="form-input" v-model="memo.name" placeholder="Name" />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Amount</label>
                    <input class="form-input" type="number" v-model.number="memo.amount" placeholder="0.00" />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Due Date</label>
                    <input class="form-input" type="date" v-model="memo.dueDate" />
                  </div>
                </div>
                <button class="btn btn-primary btn-block" @click="addMemo">Save Memo</button>

                <div v-if="memos.length" class="mt-md">
                  <div v-for="(m, i) in memos" :key="i" class="memo-item">
                    <div class="memo-days" :class="m.daysLeft <= 3 ? 'urgent' : (m.daysLeft <= 7 ? 'soon' : 'normal')">

      setup() {
        const activeTool = ref('dca');

        const tools = [
          { id: 'dca', label: 'DCA Profit-Taking', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>' },
          { id: 'calendar', label: 'Wealth Calendar', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
          { id: 'loan', label: 'Loan Calculator', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' },
          { id: 'profit', label: 'Profit Calculator', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
          { id: 'reverse', label: 'Reverse Yield', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>' },
          { id: 'password', label: 'Password Strength', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' },
          { id: 'memo', label: 'Credit Memo', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' }
        ];

        // DCA
        const dca = reactive({ cost: 0, shares: 0, threshold: 10, currentPrice: 0 });
        const dcaPL = computed(() => dca.currentPrice > 0 ? (dca.currentPrice - dca.cost) * dca.shares : 0);

        // Calendar
        const calEvent = reactive({ name: '', buyDate: '', term: 90 });
        const calEvents = ref([]);
        function addCalEvent() {
          if (!calEvent.name || !calEvent.buyDate || !calEvent.term) return;
          const buy = new Date(calEvent.buyDate);
          const maturity = new Date(buy.getTime() + calEvent.term * 86400000);
          calEvents.value.push({
            name: calEvent.name,
            buyDate: calEvent.buyDate,
            term: calEvent.term,
            maturityDate: maturity.toISOString().slice(0, 10)
          });
          calEvent.name = '';
          calEvent.buyDate = '';
          calEvent.term = 90;
        }

        // Loan
        const loan = reactive({ amount: 0, rate: 5, term: 360, method: 'equal' });
        const loanResult = computed(() => {
          if (!loan.amount || !loan.rate || !loan.term) return null;
          const monthlyRate = loan.rate / 100 / 12;
          if (loan.method === 'equal') {
            const factor = Math.pow(1 + monthlyRate, loan.term);
            const monthly = loan.amount * monthlyRate * factor / (factor - 1);
            const total = monthly * loan.term;
            return { monthly: monthly.toFixed(2), total: total.toFixed(2), interest: (total - loan.amount).toFixed(2) };
          } else {
            const principalMonthly = loan.amount / loan.term;
            let totalInterest = 0;
            let firstMonth = 0;
            for (let i = 0; i < loan.term; i++) {
              const interest = (loan.amount - principalMonthly * i) * monthlyRate;
              totalInterest += interest;
              if (i === 0) firstMonth = principalMonthly + interest;
            }
            const total = loan.amount + totalInterest;
            return { monthly: firstMonth.toFixed(2), total: total.toFixed(2), interest: totalInterest.toFixed(2) };
          }
        });

        // Profit
        const profit = reactive({ cost: 0, price: 0, qty: 0 });

        // Reverse
        const reverse = reactive({ target: 0, principal: 0, years: 1 });
        const reverseResult = computed(() => {
          if (!reverse.target || !reverse.principal || !reverse.years) return null;
          const ratio = reverse.target / reverse.principal;
          if (ratio <= 0) return null;
          const annual = (Math.pow(ratio, 1 / reverse.years) - 1) * 100;
          return annual.toFixed(2);
        });

        // Password
        const pwd = reactive({ input: '' });
        const pwdHash = computed(() => pwd.input ? md5(pwd.input) : '');
        const pwdScore = computed(() => {
          const v = pwd.input;
          if (!v) return 0;
          let s = 0;
          if (v.length >= 8) s += 25;
          if (v.length >= 12) s += 15;
          if (/[a-z]/.test(v)) s += 15;
          if (/[A-Z]/.test(v)) s += 15;
          if (/[0-9]/.test(v)) s += 15;
          if (/[^a-zA-Z0-9]/.test(v)) s += 15;
          return Math.min(s, 100);
        });
        const pwdLabel = computed(() => {
          const s = pwdScore.value;
          if (s < 30) return 'Weak';
          if (s < 60) return 'Fair';
          if (s < 80) return 'Good';
          return 'Strong';
        });
        const pwdColor = computed(() => {
          const s = pwdScore.value;
          if (s < 30) return 'var(--color-danger)';
          if (s < 60) return 'var(--color-warning)';
          return 'var(--color-success)';
        });

        // Memo
        const memo = reactive({ name: '', amount: 0, dueDate: '' });
        const memos = ref([]);
        function addMemo() {
          if (!memo.name || !memo.amount || !memo.dueDate) return;
          const due = new Date(memo.dueDate);
          const today = new Date();
          const diff = Math.ceil((due - today) / 86400000);
          memos.value.push({
            name: memo.name,
            amount: memo.amount,
            dueDate: memo.dueDate,
            daysLeft: Math.max(0, diff)
          });
          memo.name = '';
          memo.amount = 0;
          memo.dueDate = '';
        }

        return {
          activeTool, tools,
          dca, dcaPL,
          calEvent, calEvents, addCalEvent,
          loan, loanResult,
          profit,
          reverse, reverseResult,
          pwd, pwdHash, pwdScore, pwdLabel, pwdColor,
          memo, memos, addMemo
        };
      }
    };

                <p>Our focus is on building lightweight, privacy-respecting tools that work entirely on your device. No accounts, no tracking, no unnecessary data collection — just useful features that help you stay informed.</p>
                <h2>Get in Touch</h2>
                <p>We welcome feedback and suggestions. Reach us at com.cleaningyasmine.bubbleclean@gmail.com.</p>
              </div>
            </div>
          </div>
        </div>
      `
    };

    const CheckinPage = {
      template: `
        <div class="page">
          <div class="app-header safe-top">
            <button class="back-btn" @click="$router.back()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="header-title">Monthly Check-in</div>
            <div style="width:44px;"></div>
          </div>
          <div class="page-scroll no-tab">
            <div class="container mt-md">
              <div class="text-center mb-md" style="font-size:16px;font-weight:600;">{{ monthLabel }}</div>
              <div class="calendar-grid mb-md">
                <div class="calendar-cell header" v-for="d in dayNames" :key="d">{{ d }}</div>
                <div v-for="(cell, i) in calendarCells" :key="i" class="calendar-cell"
                     :class="{ 'today': cell.isToday, 'checked': cell.isChecked, 'empty': !cell.day }">
                  <span v-if="cell.day">{{ cell.day }}</span>
                </div>
              </div>
              <button class="btn btn-primary btn-block" :disabled="todayChecked" @click="doCheckin">
                {{ todayChecked ? 'Already Checked In' : 'Check In Today' }}
              </button>
              <div class="text-center text-muted text-sm mt-md">
                Checked {{ checkedCount }} day(s) this month
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const monthLabel = monthNames[month] + ' ' + year;
        const dayNames = ['S','M','T','W','T','F','S'];

        const storageKey = 'snefin_checkin_' + year + '_' + month;
        const checkedDays = ref(JSON.parse(localStorage.getItem(storageKey) || '[]'));

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const calendarCells = computed(() => {
          const cells = [];
          for (let i = 0; i < firstDay; i++) {
            cells.push({ day: 0, isToday: false, isChecked: false });
          }
          for (let d = 1; d <= daysInMonth; d++) {
            cells.push({
              day: d,
              isToday: d === today,
              isChecked: checkedDays.value.includes(d)
            });
          }
          return cells;
        });

        const todayChecked = computed(() => checkedDays.value.includes(today));
        const checkedCount = computed(() => checkedDays.value.length);

        function doCheckin() {
          if (todayChecked.value) return;
          checkedDays.value = [...checkedDays.value, today];
          localStorage.setItem(storageKey, JSON.stringify(checkedDays.value));
          window.dispatchEvent(new CustomEvent('toast', { detail: 'Check-in successful!' }));
        }

        return { monthLabel, dayNames, calendarCells, todayChecked, checkedCount, doCheckin };
      }
    };

    const FeedbackPage = {
      template: `
        <div class="page">
          <div class="app-header safe-top">
            <button class="back-btn" @click="$router.back()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="header-title">Feedback</div>
            <div style="width:44px;"></div>
          </div>
          <div class="page-scroll no-tab">
            <div class="container mt-md">
              <div class="form-group">
                <label class="form-label">Title</label>
                <input class="form-input" v-model="title" placeholder="Subject" />
              </div>
              <div class="form-group">
                <label class="form-label">Message</label>
                <textarea class="form-textarea" v-model="content" placeholder="Describe your feedback..."></textarea>
              </div>
              <button class="btn btn-primary btn-block" :disabled="!canSend" @click="send">Send</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const title = ref('');
        const content = ref('');
        const canSend = computed(() => title.value.trim() && content.value.trim());

        function send() {
          if (!canSend.value) return;
          window.dispatchEvent(new CustomEvent('toast', { detail: 'Feedback sent successfully' }));
          title.value = '';
          content.value = '';
          setTimeout(() => router.back(), 400);
        }

        return { title, content, canSend, send };
      }
    };

    const InboxPage = {
      template: `
        <div class="page">
          <div class="app-header safe-top">
            <button class="back-btn" @click="$router.back()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="header-title">Inbox</div>
            <div style="width:44px;"></div>
          </div>
          <div class="page-scroll no-tab">
            <div class="settings-list">
              <div v-for="(msg, i) in messages" :key="i" class="settings-item" @click="openMsg = msg">
                <div class="settings-item-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div class="settings-item-text">{{ msg.title }}</div>
                <div class="settings-item-arrow">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              </div>
            </div>

            <div v-if="openMsg" class="modal-overlay" @click.self="openMsg = null">
              <div class="modal-content">
                <div class="modal-title">{{ openMsg.title }}</div>
                <div class="modal-body">{{ openMsg.content }}</div>
                <button class="btn btn-primary btn-block modal-close" @click="openMsg = null">Close</button>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const messages = ref([
          {
            title: 'Welcome',
            content: 'Welcome to Snefin! We are excited to have you on board. Explore market insights, use our financial tools, and stay on top of your investment goals. If you have any questions, feel free to reach out through the Feedback page.'
          }
        ]);
        const openMsg = ref(null);
        return { messages, openMsg };
      }
    };

    /* ============================================================
       ROUTER CONFIGURATION
       ============================================================ */
    const routes = [
      { path: '/', redirect: '/loading' },
      { path: '/loading', component: LoadingPage },
      { path: '/home', component: HomePage },
      { path: '/stock/:symbol', component: StockDetailPage },
      { path: '/gainers', component: TopGainersPage },
      { path: '/losers', component: TopLosersPage },
      { path: '/active', component: MostActivePage },
      { path: '/potential', component: PotentialPage },
      { path: '/picks', component: TodaysPicksPage },
      { path: '/guide', component: GuidePage },
      { path: '/not-recommended', component: NotRecommendedPage },
      { path: '/watchlist', component: WatchlistPage },
      { path: '/toolbox', component: ToolboxPage },
      { path: '/settings', component: SettingsPage },
      { path: '/version', component: VersionPage },
      { path: '/privacy', component: PrivacyPage },
      { path: '/terms', component: TermsPage },
      { path: '/team', component: TeamPage },
      { path: '/checkin', component: CheckinPage },
      { path: '/feedback', component: FeedbackPage },
      { path: '/inbox', component: InboxPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    /* ============================================================
       APP COMPONENT
       ============================================================ */
    const App = {
      template: `
        <router-view v-slot="{ Component }">
          <transition name="page" mode="out-in">
            <component :is="Component" />
          </transition>
        </router-view>

        <!-- Bottom Tab Bar (only visible on main pages) -->
        <nav class="tab-bar safe-bottom" v-if="showTab">
          <router-link to="/home" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </router-link>
          <router-link to="/toolbox" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <span>Toolbox</span>
          </router-link>
          <router-link to="/settings" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Settings</span>
          </router-link>
        </nav>

        <!-- Global Toast -->
        <transition name="fade-slide">
          <div v-if="toastMsg" class="toast">{{ toastMsg }}</div>
        </transition>
      `,
      setup() {
        const route = useRoute();
        const mainRoutes = ['/home', '/toolbox', '/settings'];
        const showTab = computed(() => mainRoutes.includes(route.path));

        const toastMsg = ref('');
        let toastTimer = null;

        function onToast(e) {
          toastMsg.value = e.detail;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { toastMsg.value = ''; }, 2000);
        }

        onMounted(() => window.addEventListener('toast', onToast));
        onUnmounted(() => {
          window.removeEventListener('toast', onToast);
          clearTimeout(toastTimer);
        });

        return { showTab, toastMsg };
      }
    };

    /* ============================================================
       MOUNT
       ============================================================ */
    const app = createApp(App);
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
